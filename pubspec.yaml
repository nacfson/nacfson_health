name: nacfson_health
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 상태 관리
  flutter_riverpod: ^2.6.1

  # 라우팅
  go_router: ^14.8.1

  # 로컬 DB
  sqflite: ^2.4.2
  path: ^1.9.1

  # Supabase
  supabase_flutter: ^2.8.4

  # 환경 변수
  flutter_dotenv: ^5.2.1

  # URL 런처 (OAuth 브라우저 오픈)
  url_launcher: ^6.3.1

  # 로컬 저장소 및 유틸리티
  shared_preferences: ^2.3.5
  uuid: ^4.5.1
  intl: ^0.20.2

  # UI 및 위젯
  fl_chart: ^0.70.2
  home_widget: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  sqflite_common_ffi: ^2.3.4+1
  sqflite_common_ffi_web: ^1.1.0

flutter:
  uses-material-design: true
  assets:
    - .env
