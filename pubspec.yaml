name: nacfson_health
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 상태 관리
  flutter_riverpod: ^2.6.1

  # 라우팅
  go_router: ^14.8.1

  # 로컬 DB
  sqflite: ^2.4.2
  path: ^1.9.1

  # Supabase
  supabase_flutter: ^2.8.4

  # 환경 변수
  flutter_dotenv: ^5.2.1

  # URL 런처 (OAuth 브라우저 오픈)
  url_launcher: ^6.3.1

  # 로컬 저장소 및 유틸리티
  shared_preferences: ^2.3.5
  uuid: ^4.5.1
  intl: ^0.20.2

  # UI 및 위젯
  fl_chart: ^0.70.2
  home_widget: ^0.9.1
  flutter_staggered_animations: ^1.1.1   # 템플릿 시트 카드 staggered fade-in

  # iOS 26 Liquid Glass (iOS 전용 PlatformView, iOS ≤ 25 / Android 는 fallback)
  native_liquid_glass: ^0.2.6

  # AI
  google_generative_ai: ^0.4.7

  # 사진 음식 분석
  image_picker: ^1.1.2
  image: ^4.2.0
  crypto: ^3.0.5

  # 휴식 타이머 — 네이티브 위젯/알림
  live_activities: ^2.4.7           # iOS Dynamic Island + Lock Screen Live Activity (v2.4.4+ iOSEnableRemoteUpdates:false 로 aps-environment 불필요)
  flutter_local_notifications: ^17.2.4  # Android persistent notification (chronometer + actions), iOS 5초전/완료 예약 알림
  permission_handler: ^12.0.1       # Android 13+ POST_NOTIFICATIONS 권한 요청 (live_activities v2.4.4+ 요구)
  timezone: ^0.9.4                  # flutter_local_notifications zonedSchedule 에 필요

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  sqflite_common_ffi: ^2.3.4+1
  sqflite_common_ffi_web: ^1.1.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"
  image_path: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - .env
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.ttf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.ttf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.ttf
          weight: 700
