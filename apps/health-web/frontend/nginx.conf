worker_processes auto;
# The pod runs non-root with a read-only root filesystem; only /tmp,
# /var/cache/nginx and /var/log/nginx are writable (emptyDirs).
pid /tmp/nginx.pid;
error_log /dev/stderr error;
events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;

  map $status $log_level {
    ~^5     error;
    ~^4     warn;
    default info;
  }
  map $status $log_exc {
    ~^5     "HTTP $status";
    default "";
  }
  map $time_iso8601 $log_t_main {
    ~^(?<p>\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d) $p;
  }
  map $time_iso8601 $log_t_tz {
    ~(?<z>[+-]\d\d:\d\d|Z)$ $z;
  }
  map $msec $log_t_ms {
    ~\.(?<ms>\d{3}) $ms;
    default         000;
  }
  map $request_id $tp_parent {
    ~^(?<p>[0-9a-f]{16}) $p;
    default              0000000000000001;
  }

  log_format contract escape=json
    '{'
      '"time":"$log_t_main.$log_t_ms$log_t_tz",'
      '"level":"$log_level",'
      '"msg":"$request_method $uri $status",'
      '"service.name":"health-web",'
      '"service.version":"__SERVICE_VERSION__",'
      '"trace_id":"$request_id",'
      '"http.request.method":"$request_method",'
      '"url.path":"$uri",'
      '"http.response.status_code":$status,'
      '"http.server.request.duration":$request_time,'
      '"exception.message":"$log_exc"'
    '}';

  access_log /dev/stdout contract;

  # API Service in namespace proj-health. See nacfson_pipeline
  # deploy/projects/health/workloads/services.yaml (Service/health-backend).
  upstream api {
    server health-backend:8080;
  }

  server {
    # Unprivileged port: the pod drops all capabilities. Service targetPort and
    # probes use 8080.
    listen 8080;
    server_name health.nacfson.cloud _;

    location = /healthz {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header traceparent "00-$request_id-$tp_parent-01";
    }

    location = /readyz {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header traceparent "00-$request_id-$tp_parent-01";
    }

    location /api/ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Cookie $http_cookie;
      proxy_set_header Origin $http_origin;
      proxy_set_header traceparent "00-$request_id-$tp_parent-01";
      # Never trust client-supplied identity headers.
      proxy_set_header X-User-Id "";
      proxy_set_header X-User-Email "";
      proxy_set_header X-User-Roles "";
    }

    location / {
      root /usr/share/nginx/html;
      index index.html;
      try_files $uri $uri/ /index.html;
    }
  }
}
