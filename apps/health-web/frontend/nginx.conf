worker_processes auto;
# The pod runs non-root with a read-only root filesystem; only /tmp,
# /var/cache/nginx and /var/log/nginx are writable (emptyDirs).
pid /tmp/nginx.pid;
events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;

  # API Service in namespace proj-health. See nacfson_pipeline
  # deploy/projects/health/workloads/services.yaml (Service/health-backend).
  upstream api {
    server health-backend:8080;
  }

  server {
    # Unprivileged port: the pod drops all capabilities. Service targetPort and
    # probes use 8080.
    listen 8080;
    server_name health.nacfson.cloud _;

    location = /healthz {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location = /readyz {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Cookie $http_cookie;
      proxy_set_header Origin $http_origin;
      # Never trust client-supplied identity headers.
      proxy_set_header X-User-Id "";
      proxy_set_header X-User-Email "";
      proxy_set_header X-User-Roles "";
    }

    location / {
      root /usr/share/nginx/html;
      index index.html;
      try_files $uri $uri/ /index.html;
    }
  }
}
